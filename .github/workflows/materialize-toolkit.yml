name: Materialize toolkit artifacts

on:
  push:
    paths:
      - '.payload/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble clean artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part*.b64 | base64 --decode > /tmp/toolkit.zip
          rm -rf /tmp/toolkit
          mkdir -p /tmp/toolkit
          unzip -q /tmp/toolkit.zip -d /tmp/toolkit
          mkdir -p print editable workbook bundle
          cp /tmp/toolkit/Operational_Authority_Toolkit_CC0.pdf print/Operational_Authority_Toolkit_CC0.pdf
          cp /tmp/toolkit/Operational_Authority_Toolkit_CC0.docx editable/Operational_Authority_Toolkit_CC0.docx
          cp /tmp/toolkit/Record_of_Truth_Interface_Authority_Matrix_CC0.xlsx workbook/Record_of_Truth_Interface_Authority_Matrix_CC0.xlsx
          cp /tmp/toolkit.zip bundle/Operational_Authority_Toolkit_CC0.zip
          sha256sum \
            print/Operational_Authority_Toolkit_CC0.pdf \
            editable/Operational_Authority_Toolkit_CC0.docx \
            workbook/Record_of_Truth_Interface_Authority_Matrix_CC0.xlsx \
            bundle/Operational_Authority_Toolkit_CC0.zip > SHA256SUMS.txt
          rm -rf .payload
      - name: Commit byte-identical artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish clean toolkit artifacts'
          git push
